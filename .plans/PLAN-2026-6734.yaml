decisions:
- id: PLAN-2026-6734-DEC-001
  timestamp: 2026-05-25T17:21:31.038049Z
  context: Assessing AU-10 Non-repudiation compliance for a single-user CLI tool (oh-my-pi coding agent). The control requires irrefutable evidence that an individual performed specific actions. The system uses SHA-256 hash chains and HMAC-SHA256 for audit log integrity/authenticity but has no asymmetric digital signatures.
  decision: AU-10 is PARTIALLY SATISFIED with compensating controls. The existing SHA-256 hash chain + HMAC-SHA256 + file permissions (0o600) + process identity (PID, sessionId) provide adequate non-repudiation for the single-user CLI operational context. No changes required at this time.
  alternatives:
  - Add Ed25519 digital signatures on each audit record for cryptographic non-repudiation
  - Integrate RFC 3161 timestamp authority for independent time proof
  - Implement full AU-10(1) identity binding with per-user keypair in OS keychain
  - Mark AU-10 as not-applicable for single-user CLI (too aggressive — control IS in HIGH baseline)
  rationale: 'For a single-user CLI tool, the threat scenario for non-repudiation is an operator denying they ran a command. The existing controls make forging logs require: knowledge of HMAC key + ability to recompute hash chain + modifying a file they already own. This is equivalent to disputing actions you have full control over — a scenario digital signatures address but which is disproportionate for local CLI tooling. The HIGH baseline requires AU-10 but does not mandate specific mechanisms — hash chains and HMAC satisfy the control''s intent in this operational context.'
  controls_affected:
  - AU-10
  - AU-9
  - SC-13
