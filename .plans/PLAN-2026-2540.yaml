- id: PLAN-2026-2540-DEC-002
  timestamp: 2026-05-07T19:31:38.229232Z
  context: MFA/PIV requirements for single-user CLI
  decision: Defer MFA/PIV to provider layer via LiteLLM proxy
  alternatives:
  - Implement local MFA
  - Require PIV
  - Accept risk
  rationale: Provider authentication via API keys through LiteLLM proxy. MFA at provider layer. Local MFA provides no benefit for OS-authenticated single user.
  controls_affected:
  - IA-2.1
  - IA-2.2
  - IA-2.12
  - IA-8.1
  - SA-4.10
