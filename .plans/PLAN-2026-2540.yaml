  timestamp: 2026-05-07T19:31:37.212075Z
  context: Applicability of organizational/physical controls for a CLI tool
  decision: Classify PE, MP, MA, CP, AT, PS, IR, PL, RA families as not-applicable
  alternatives:
  - Address all controls regardless
  - Create compensating controls
  - Target MODERATE baseline
  rationale: Local CLI tool with no facility, media, hardware, hosted service, SOC, or personnel management. NIST scoping allows documented non-applicability.
