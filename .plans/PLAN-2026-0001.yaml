decisions:
  - id: PLAN-2026-0001-DEC-001
    timestamp: 2026-04-27T00:00:00.000000Z
    context: >
      Needed to choose between always using absolute positioning vs only
      in detected embedded terminals.
    decision: "Use absolute positioning only when $NVIM or $VIM_TERMINAL is set"
    alternatives:
      - "Always use absolute positioning for all terminals"
      - "Attempt to fix relative cursor tracking drift"
    rationale: >
      Absolute positioning is immune to cursor tracking drift but changes the
      escape sequence pattern. Limiting to detected embedded terminals avoids
      risk to the well-tested relative movement path in normal terminals.
    controls_affected:
      - CM-3
  - id: PLAN-2026-0001-DEC-002
    timestamp: 2026-04-27T00:00:00.000000Z
    context: >
      isEmbeddedTerminal was initially a module-level constant (not testable
      per-instance). Needed a way to exercise both code paths in tests.
    decision: "Refactored to instance field with setEmbeddedTerminal() setter"
    alternatives:
      - "Keep module constant; test via subprocess with NVIM=1"
      - "Use mock.module() (prohibited by AGENTS.md)"
    rationale: >
      Instance field follows existing setClearOnShrink() pattern. Subprocess
      testing is fragile and slow. mock.module() is explicitly banned.
    controls_affected: []

